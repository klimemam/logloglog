<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a78d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ワークアウトやランニングなど、日々の習慣をワンタップで記録して、目標達成とレベルアップを可視化するアプリ" />
    <meta property="og:title" content="LogLogLog — 習慣ログ" />
    <meta property="og:description" content="習慣をワンタップ記録。筋トレはワークアウトモードでセットごとに記録、成長は推定1RMで見える化。無料・登録不要。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://klimemam.github.io/logloglog/" />
    <meta property="og:image" content="https://klimemam.github.io/logloglog/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LogLogLog" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>LogLogLog — 習慣ログ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {})
          // 初回訪問時、Service Workerが制御を持つ前に読み込まれたファイルは
          // キャッシュされず「インストール直後に圏外だと開けない」状態になっていた。
          // 実際に読み込んだリソースをこちらから登録しておく
          if ('caches' in window) {
            var urls = ['./', './index.html', './manifest.webmanifest']
            try {
              performance.getEntriesByType('resource').forEach(function (e) {
                if (e.name.indexOf(location.origin) === 0 && !/update-check=/.test(e.name)) {
                  urls.push(e.name)
                }
              })
            } catch (_) {}
            caches.open('logloglog-v1').then(function (c) {
              urls.forEach(function (u) {
                c.match(u).then(function (hit) {
                  if (!hit) c.add(u).catch(function () {})
                })
              })
            })
          }
        })
      }
    </script>
  </body>
</html>
